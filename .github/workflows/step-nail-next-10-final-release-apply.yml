jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore final release patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > /tmp/apply_nail_next10.py

      - name: Apply STEP NAIL-NEXT-10
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_nail_next10.py

      - name: Validate final release
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html owner.html owner-ipad.html member.html system-check.html release.html; do
            test -s "$file"
            grep -q "STEP NAIL-NEXT-10" "$file"
            grep -q 'name="dpro-final-version"' "$file"
          done
          test -s release-manifest.json
          grep -q '"release": "STEP NAIL-NEXT-10"' release-manifest.json
          grep -q 'key:"release",label:"完成版確認"' system-check.html
          grep -q 'id="finalRelease"' system-check.html
          grep -q 'expected:"FINAL"' system-check.html

          python - <<'PY'
          import json,re
          from pathlib import Path
          for name in ("index.html","owner.html","owner-ipad.html","member.html","system-check.html","release.html"):
              html=Path(name).read_text(encoding="utf-8")
              scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,flags=re.S|re.I)
              Path("/tmp/"+name+".js").write_text("\n".join(scripts),encoding="utf-8")
          m=json.loads(Path("release-manifest.json").read_text(encoding="utf-8"))
          assert m["release"]=="STEP NAIL-NEXT-10"
          PY

          node --check /tmp/index.html.js
          node --check /tmp/owner.html.js
          node --check /tmp/owner-ipad.html.js
          node --check /tmp/member.html.js
          node --check /tmp/system-check.html.js
          node --check /tmp/release.html.js
          echo "STEP NAIL-NEXT-10 final release validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html owner.html owner-ipad.html member.html system-check.html release.html release-manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "STEP NAIL-NEXT-10 final release integration"
          git push
