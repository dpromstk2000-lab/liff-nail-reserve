          base64 --decode /tmp/index.html.b64 > index.html
          rm -f /tmp/index.html.b64

      - name: Validate generated file
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "STEP NAIL-NEXT-4" index.html
          grep -q "DPRO NAIL LINE NEXT" index.html
          grep -q "/api/public/designs" index.html
          grep -q "/api/public/repeat-template" index.html
          grep -q "/api/reservations/repeat" index.html
          grep -q "/api/reservations/create" index.html
          echo "index.html validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "STEP NAIL-NEXT-4 customer reservation brush up"
          git push
