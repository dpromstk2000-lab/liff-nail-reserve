jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore owner-ipad.html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_IPAD_HTML_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > owner-ipad.html

      - name: Validate owner-ipad.html
        shell: bash
        run: |
          set -euo pipefail
          test -s owner-ipad.html
          grep -q "STEP NAIL-NEXT-6" owner-ipad.html
          grep -q "DPRO NAIL LINE NEXT" owner-ipad.html
          grep -q "/api/admin/treatments/save" owner-ipad.html
          grep -q "/api/admin/treatments/complete" owner-ipad.html
          grep -q "/api/admin/reservations/workflow" owner-ipad.html
          grep -q "/api/admin/photos/prepare" owner-ipad.html
          grep -q "/api/admin/photos/complete" owner-ipad.html
          grep -q "/api/admin/photos/signed-url" owner-ipad.html
          grep -q "/api/admin/reservations/manual-create" owner-ipad.html
          echo "STEP NAIL-NEXT-6 owner-ipad.html validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner-ipad.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-6 store iPad operation brush up"
          git push
