jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore system-check.html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$SYSTEM_CHECK_HTML_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > system-check.html

      - name: Validate system-check.html
        shell: bash
        run: |
          set -euo pipefail
          test -s system-check.html
          grep -q "STEP NAIL-NEXT-8" system-check.html
          grep -q "DPRO NAIL LINE NEXT" system-check.html
          grep -q "/api/admin/system-check" system-check.html
          grep -q "/api/admin/demo/prepare" system-check.html
          grep -q "/api/public/designs" system-check.html
          grep -q "/api/public/customer" system-check.html
          grep -q "STEP NAIL-NEXT-4" system-check.html
          grep -q "STEP NAIL-NEXT-5" system-check.html
          grep -q "STEP NAIL-NEXT-6" system-check.html
          grep -q "STEP NAIL-NEXT-7" system-check.html
          echo "STEP NAIL-NEXT-8 system-check.html validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system-check.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-8 system check brush up"
          git push
