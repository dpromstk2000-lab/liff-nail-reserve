jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore patch script
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > /tmp/apply_nail_next9.py

      - name: Apply NEXT-9 patch
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_nail_next9.py

      - name: Validate owner and system check
        shell: bash
        run: |
          set -euo pipefail
          test -s owner.html
          test -s system-check.html
          grep -q "STEP NAIL-NEXT-9" owner.html
          grep -q 'id="view-followups"' owner.html
          grep -q "async function loadFollowupQueue" owner.html
          grep -q "予約済み自動除外済み" owner.html
          grep -q "/api/admin/customers/detail" owner.html
          grep -q "/api/admin/followups/update-status" owner.html
          grep -q "/api/line/log-copy" owner.html
          grep -q 'marker:"STEP NAIL-NEXT-9",expected:"NEXT-9"' system-check.html

          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("owner.html", "system-check.html"):
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY

          node --check /tmp/owner.html.js
          node --check /tmp/system-check.html.js
          echo "STEP NAIL-NEXT-9 validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add owner.html system-check.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-9 follow-up and LINE message management"
          git push
