name: STEP DPRO-SYSTEMS-11 Nail Salon Operation Demo R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/step-dpro-systems-11-nail-operation-demo-r2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create and clarify nail salon public operation demo
        shell: python
        run: |
          from pathlib import Path
          import base64
          import re

          official_url = "https://dpro-shop.com/systems/nail"
          guide = base64.b64decode("").decode("utf-8")
          banner = base64.b64decode("").decode("utf-8")
          shared_css = base64.b64decode("").decode("utf-8")
          css_marker = "/* DPRO-SYSTEMS-11 NAIL OPERATION DEMO */"

          screen_files = [
              "index.html",
              "member.html",
              "owner-ipad.html",
              "owner.html",
          ]

          body_classes = {
              "index.html": "nail-operation-customer",
              "member.html": "nail-operation-member",
              "owner-ipad.html": "nail-operation-ipad",
              "owner.html": "nail-operation-owner",
          }

          titles = {
              "index.html": "DPRO ネイルサロン LINE｜公開操作デモ・LINE予約",
              "member.html": "DPRO ネイルサロン LINE｜公開操作デモ・会員ページ",
              "owner-ipad.html": "DPRO ネイルサロン LINE｜公開操作デモ・店頭iPad",
              "owner.html": "DPRO ネイルサロン LINE｜公開操作デモ・オーナー管理",
          }

          for filename in screen_files:
              if not Path(filename).exists():
                  raise SystemExit(f"ERROR: required public screen not found: {filename}")

          # 内部バージョン情報を変更前後で比較するため保存
          version_pattern = re.compile(
              r'<meta\s+name=["\']dpro-final-version["\'][^>]*>'
              r'|<div\s+id=["\']dproFinalVersion["\'][^>]*>.*?</div>'
              r'|\b(?:const|let|var)\s+[A-Z0-9_]*VERSION[A-Z0-9_]*\s*=\s*[^;]+;',
              flags=re.I | re.S,
          )
          versions_before = {
              filename: version_pattern.findall(Path(filename).read_text(encoding="utf-8"))
              for filename in screen_files
          }

          Path("demo-guide.html").write_text(guide, encoding="utf-8")

          def set_title(text, filename):
              match = re.search(r"<title>.*?</title>", text, flags=re.I | re.S)
              if not match:
                  raise SystemExit(f"ERROR: title tag not found: {filename}")
              return text[:match.start()] + f"<title>{titles[filename]}</title>" + text[match.end():]

          def add_demo_meta(text, filename):
              if 'name="robots" content="noindex,nofollow,noarchive"' not in text:
                  close = re.search(r"</head>", text, flags=re.I)
                  if not close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  meta = (
                      '\n<meta name="robots" content="noindex,nofollow,noarchive">'
                      f'\n<link rel="canonical" href="{official_url}">\n'
                  )
                  text = text[:close.start()] + meta + text[close.start():]
              elif f'href="{official_url}"' not in text:
                  close = re.search(r"</head>", text, flags=re.I)
                  if not close:
                      raise SystemExit(f"ERROR: head closing tag not found: {filename}")
                  text = text[:close.start()] + f'\n<link rel="canonical" href="{official_url}">\n' + text[close.start():]
              return text

          def add_body_classes(text, filename):
              match = re.search(r"<body([^>]*)>", text, flags=re.I)
              if not match:
                  raise SystemExit(f"ERROR: body tag not found: {filename}")
              required = ["nail-operation-demo-page", body_classes[filename]]
              attrs = match.group(1)
              class_match = re.search(r'class="([^"]*)"', attrs)
              if class_match:
                  classes = class_match.group(1).split()
                  for name in required:
                      if name not in classes:
                          classes.append(name)
                  attrs = (
                      attrs[:class_match.start()] +
                      'class="' + " ".join(classes) + '"' +
                      attrs[class_match.end():]
                  )
              else:
                  attrs += ' class="' + " ".join(required) + '"'
              return text[:match.start()] + "<body" + attrs + ">" + text[match.end():]

          def add_css(text, filename):
              if css_marker in text:
                  return text
              close = re.search(r"</style>", text, flags=re.I)
              if not close:
                  raise SystemExit(f"ERROR: style closing tag not found: {filename}")
              return text[:close.start()] + "\n" + shared_css.strip() + "\n" + text[close.start():]

          def add_banner(text, filename):
              # CSS内のクラス名ではなく、実際のHTML要素だけを判定
              element_pattern = re.compile(
                  r'<section\\b[^>]*class=["\\\'][^"\\\']*\\bnail-operation-demo-banner\\b[^"\\\']*["\\\'][^>]*>',
                  flags=re.I,
              )
              if element_pattern.search(text):
                  return text
              body = re.search(r"<body[^>]*>", text, flags=re.I)
              if not body:
                  raise SystemExit(f"ERROR: body tag not found for banner: {filename}")
              return text[:body.end()] + "\n" + banner + "\n" + text[body.end():]

          for filename in screen_files:
              text = Path(filename).read_text(encoding="utf-8")
              text = set_title(text, filename)
              text = add_demo_meta(text, filename)
              text = add_body_classes(text, filename)
              text = add_css(text, filename)
              text = add_banner(text, filename)
              Path(filename).write_text(text, encoding="utf-8")

          guide_text = Path("demo-guide.html").read_text(encoding="utf-8")
          assert "公開操作デモ・画面一覧" in guide_text
          assert "店舗側デモ管理コード：1234" in guide_text
          assert guide_text.count('class="card"') == 4
          assert "system-check" not in guide_text
          assert "システム確認" not in guide_text
          for target in screen_files:
              assert f'href="{target}' in guide_text

          banner_element_pattern = re.compile(
              r'<section\\b[^>]*class=["\\\'][^"\\\']*\\bnail-operation-demo-banner\\b[^"\\\']*["\\\'][^>]*>',
              flags=re.I,
          )

          for filename in screen_files:
              content = Path(filename).read_text(encoding="utf-8")
              assert titles[filename] in content, filename
              assert 'name="robots" content="noindex,nofollow,noarchive"' in content, filename
              assert f'<link rel="canonical" href="{official_url}">' in content, filename
              assert "nail-operation-demo-page" in content, filename
              assert body_classes[filename] in content, filename
              assert banner_element_pattern.search(content), filename
              assert css_marker in content, filename
              assert "demo-guide.html" in content, filename
              assert official_url in content, filename

          owner = Path("owner.html").read_text(encoding="utf-8")
          assert '.nav-btn[data-view="check"]' in owner
          assert '#view-check' in owner
          assert "display:none!important" in owner

          # 内部バージョン情報、内部確認ファイル、共通設定は変更しない
          versions_after = {
              filename: version_pattern.findall(Path(filename).read_text(encoding="utf-8"))
              for filename in screen_files
          }
          assert versions_after == versions_before, "内部バージョン情報が変更されています"
          assert Path("system-check.html").exists(), "system-check.html is missing"
          assert Path("config.js").exists(), "config.js is missing"

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "dpro-systems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo-guide.html index.html member.html owner-ipad.html owner.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "STEP DPRO-SYSTEMS-11 clarify nail salon operation demo R2"
          git push
