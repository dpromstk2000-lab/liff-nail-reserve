jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nail repository
        uses: actions/checkout@v6

      - name: Restore demo preview patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > /tmp/apply_nail_next11_r1.py

      - name: Apply safe product-site auto login
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/apply_nail_next11_r1.py

      - name: Validate nail preview security and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          grep -q "STEP NAIL-NEXT-11-R1" owner.html
          grep -q "STEP NAIL-NEXT-11-R1" owner-ipad.html
          grep -q 'p.get("demo")==="1"' owner.html
          grep -q 'p.get("auto")==="1"' owner.html
          grep -q 'p.get("embed_demo")==="1"' owner.html
          grep -q 'p.get("shop_code")===SHOP_CODE' owner.html
          grep -q 'refPath.startsWith("/dpro-line-systems-site/")' owner.html
          grep -q "window.self!==window.top" owner.html
          grep -q "async function login(persist=true)" owner-ipad.html
          grep -q "await login(false)" owner-ipad.html

          python - <<'PY'
          import re
          from pathlib import Path
          for name in ("owner.html", "owner-ipad.html"):
              html = Path(name).read_text(encoding="utf-8")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY

          node --check /tmp/owner.html.js
          node --check /tmp/owner-ipad.html.js
          echo "NAIL NEXT-11-R1 nail preview validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add owner.html owner-ipad.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-11-R1 safe product site demo auto login"
          git push
