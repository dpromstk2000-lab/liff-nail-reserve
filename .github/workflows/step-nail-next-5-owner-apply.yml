jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore owner.html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_HTML_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > owner.html

      - name: Validate owner.html
        shell: bash
        run: |
          set -euo pipefail
          test -s owner.html
          grep -q "STEP NAIL-NEXT-5" owner.html
          grep -q "DPRO NAIL LINE NEXT" owner.html
          grep -q "/api/admin/day" owner.html
          grep -q "/api/admin/customers/detail" owner.html
          grep -q "/api/admin/designs/save" owner.html
          grep -q "/api/admin/treatments/save" owner.html
          grep -q "/api/admin/reservations/workflow" owner.html
          grep -q "/api/admin/photos/prepare" owner.html
          grep -q "/api/admin/system-check" owner.html
          echo "STEP NAIL-NEXT-5 owner.html validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add owner.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-5 owner PC management brush up"
          git push
