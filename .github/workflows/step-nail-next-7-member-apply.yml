jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore member.html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MEMBER_HTML_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > member.html

      - name: Validate member.html
        shell: bash
        run: |
          set -euo pipefail
          test -s member.html
          grep -q "STEP NAIL-NEXT-7" member.html
          grep -q "DPRO NAIL LINE NEXT" member.html
          grep -q "/api/public/customer" member.html
          grep -q "/api/public/available-days" member.html
          grep -q "/api/public/available-times" member.html
          grep -q "/api/reservations/repeat" member.html
          grep -q "/api/reservations/change" member.html
          grep -q "/api/reservations/cancel" member.html
          echo "STEP NAIL-NEXT-7 member.html validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add member.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-7 member experience brush up"
          git push
