jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify locked source and create rollback tag
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$LOCK_SHA^{commit}"
          if ! git merge-base --is-ancestor "$LOCK_SHA" HEAD; then
            echo "ERROR: locked source is not an ancestor of current HEAD"
            exit 1
          fi
          unexpected="$(git diff --name-only "$LOCK_SHA"..HEAD | grep -v '^.github/workflows/NAIL_PR1_APPLY.yml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: source changed after CENTRAL lock. Unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          BACKUP_TAG="nail-pr1-pre-security-${{ github.run_id }}"
          git tag "$BACKUP_TAG" "$LOCK_SHA"
          git push origin "$BACKUP_TAG"
          echo "BACKUP_TAG=$BACKUP_TAG" >> "$GITHUB_ENV"

      - name: Restore exact PR1 source files
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PR1_WORKER_GZIP_BASE64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > worker.js
          printf '%s' "$PR1_SECURITY_GZIP_BASE64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > nail-pr1-security.js
          printf '%s' "$PR1_MANIFEST_GZIP_BASE64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > release-manifest.json

      - name: Apply minimal frontend security layer
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY_PATCH'
          from pathlib import Path
          files = ["index.html", "member.html", "owner.html", "owner-ipad.html", "system-check.html", "release.html"]
          meta = '<meta name="dpro-product-ready-version" content="NAIL-PR1-20260822">'
          script = '<script src="nail-pr1-security.js?v=NAIL-PR1-20260822"></script>'
          old_worker = 'NAIL-NEXT-3-WORKER-API-COMPLETE-20260722'
          new_worker = 'NAIL-PR1-SECURITY-BOUNDARY-20260822'
          for name in files:
              p = Path(name)
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f"missing required file: {name}")
              text = p.read_text(encoding="utf-8")
              if meta not in text:
                  lower = text.lower()
                  idx = lower.find("</head>")
                  if idx < 0:
                      raise SystemExit(f"missing </head>: {name}")
                  text = text[:idx] + "  " + meta + "\n" + text[idx:]
              if script not in text:
                  pos = text.lower().find("<script")
                  if pos < 0:
                      pos = text.lower().find("</body>")
                  if pos < 0:
                      raise SystemExit(f"no script/body insertion point: {name}")
                  text = text[:pos] + script + "\n" + text[pos:]
              if name == "system-check.html":
                  text = text.replace(old_worker, new_worker)
              p.write_text(text, encoding="utf-8", newline="\n")
          PY_PATCH

      - name: Validate PR1 source and compatibility
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          node --check nail-pr1-security.js
          grep -Fq 'const SYSTEM_CODE = "NAIL"' worker.js
          grep -Fq 'NAIL-PR1-SECURITY-BOUNDARY-20260822' worker.js
          grep -Fq 'https://api.line.me/oauth2/v2.1/verify' worker.js
          grep -Fq 'DPRO_COMMON_OWNER_AUTH' worker.js
          grep -Fq '/api/security/staff/session' worker.js
          grep -Fq '/api/staff/reservations/workflow' worker.js
          grep -Fq 'async function auditVerified' worker.js
          if grep -Fq '"Access-Control-Allow-Origin": "*"' worker.js; then
            echo "ERROR: wildcard CORS remains"
            exit 1
          fi

          python3 <<'PY_VALIDATE'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,re,subprocess

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k == 'id' and v: self.ids.append(v)

          files=["index.html","member.html","owner.html","owner-ipad.html","system-check.html","release.html"]
          for name in files:
              text=Path(name).read_text(encoding='utf-8')
              if text.count('dpro-product-ready-version') != 1:
                  raise SystemExit(f"PR1 meta count != 1: {name}")
              if text.count('nail-pr1-security.js?v=NAIL-PR1-20260822') != 1:
                  raise SystemExit(f"PR1 security script count != 1: {name}")
              parser=P(); parser.feed(text); parser.close()
              seen=set(); dup=set()
              for value in parser.ids:
                  if value in seen: dup.add(value)
                  seen.add(value)
              if dup:
                  raise SystemExit(f"duplicate ids: {name} {sorted(dup)}")
              scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',text,flags=re.S|re.I)
              tmp=Path('/tmp')/(name.replace('.html','')+'-inline.js')
              tmp.write_text('\n'.join(scripts),encoding='utf-8')
              subprocess.run(['node','--check',str(tmp)],check=True)

          sc=Path('system-check.html').read_text(encoding='utf-8')
          if 'NAIL-PR1-SECURITY-BOUNDARY-20260822' not in sc:
              raise SystemExit('system-check expected Worker not updated')
          m=json.loads(Path('release-manifest.json').read_text(encoding='utf-8'))
          assert m['system_code']=='NAIL'
          assert m['legacy_internal_release_identifier']=='DPRO_NAIL_LINE_NEXT'
          assert m['release']=='STEP NAIL-NEXT-10'
          assert m['shop_code']=='nail_demo'
          PY_VALIDATE

      - name: Commit PR1 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/NAIL_PR1_APPLY.yml
          git config user.name "DPRO NAIL PR1"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ERROR: no PR1 changes generated"
            exit 1
          fi
          git commit -m "NAIL-PR1 security boundary and version contract"
          git push origin HEAD:main
          echo "PR1_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final result
        shell: bash
        run: |
          echo "NAIL-PR1 GitHub apply COMPLETE"
          echo "Rollback tag: $BACKUP_TAG"
          echo "PR1 commit: $PR1_COMMIT"
          echo "Next: deploy root worker.js to Cloudflare Worker dpro-nail-line-api"
