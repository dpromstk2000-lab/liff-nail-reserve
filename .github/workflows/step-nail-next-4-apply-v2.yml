jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore index.html
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$INDEX_HTML_GZIP_BASE64"             | tr -d '[:space:]'             | base64 --decode             | gzip --decompress             > index.html

      - name: Remove broken old workflow
        shell: bash
        run: |
          rm -f .github/workflows/step-nail-next-4-apply.yml

      - name: Validate generated file
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q "STEP NAIL-NEXT-4" index.html
          grep -q "DPRO NAIL LINE NEXT" index.html
          grep -q "/api/public/designs" index.html
          grep -q "/api/public/repeat-template" index.html
          grep -q "/api/reservations/repeat" index.html
          grep -q "/api/reservations/create" index.html
          echo "STEP NAIL-NEXT-4 validation passed"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html
          git add -A .github/workflows

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "STEP NAIL-NEXT-4 apply UI and remove broken workflow"
          git push
